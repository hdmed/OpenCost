name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m py_compile extract.py build_report.py
      - run: python -m unittest discover -s tests -v
      - run: |
          if [ ! -f data/dataset.json ]; then
            echo "CI: dataset manquant, création dummy"
            mkdir -p data
            python -c "import json; json.dump({'generated_at':'2026-08-30T00:00:00Z','db_path':'ci','pricing_config':{'models':{}},'budgets':{},'models':[],'totals':{'cost':0,'sessions':0,'tokens_input':0,'tokens_output':0,'tokens_reasoning':0,'tokens_cache_read':0,'tokens_cache_write':0},'sessions':[]}, open('data/dataset.json','w'))"
          fi
          python build_report.py --strict
